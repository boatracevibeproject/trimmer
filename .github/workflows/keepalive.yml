name: keepalive

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    permissions:
      actions: write
    runs-on: ubuntu-24.04
    steps:
      - name: Re-enable workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable "keepalive"
          gh workflow enable "tests"
